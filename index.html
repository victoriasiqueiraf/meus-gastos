<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Meus Gastos</title>
<meta name="theme-color" content="#e8f0ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meus Gastos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8f0ed; --ink:#0f1a17; --mut:rgba(15,26,23,.56); --sep:rgba(15,26,23,.08);
  --glass:rgba(255,255,255,.40); --glass-strong:rgba(255,255,255,.72); --stroke:rgba(255,255,255,.8);
  --acc:#0b9e6b; --acc2:#16c98a; --acc-ink:#fff; --neg:#e0443c; --chip:rgba(255,255,255,.5);
  --hl:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 2px rgba(255,255,255,.35);
  --drop:0 12px 32px rgba(20,70,52,.10), 0 1px 3px rgba(20,70,52,.06);
  --sheen:.75;
  --b1:#6ff0bd; --b2:#8fd6ff; --b3:#cbb8ff; --b4:#ffe38f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#05090a; --ink:#f2f6f5; --mut:rgba(242,246,245,.58); --sep:rgba(255,255,255,.08);
    --glass:rgba(30,38,42,.38); --glass-strong:rgba(44,54,58,.7); --stroke:rgba(255,255,255,.14);
    --acc:#3ee3a3; --acc2:#7af5c6; --acc-ink:#03261a; --neg:#ff7a72; --chip:rgba(255,255,255,.08);
    --hl:inset 0 1px 1px rgba(255,255,255,.16), inset 0 -1px 1px rgba(255,255,255,.04);
    --drop:0 12px 32px rgba(0,0,0,.4);
    --sheen:.18;
    --b1:#0c7a54; --b2:#12507f; --b3:#4a2f8a; --b4:#6b5410;
  }
}
:root[data-theme="dark"]{
  --bg:#05090a; --ink:#f2f6f5; --mut:rgba(242,246,245,.58); --sep:rgba(255,255,255,.08);
  --glass:rgba(30,38,42,.38); --glass-strong:rgba(44,54,58,.7); --stroke:rgba(255,255,255,.14);
  --acc:#3ee3a3; --acc2:#7af5c6; --acc-ink:#03261a; --neg:#ff7a72; --chip:rgba(255,255,255,.08);
  --hl:inset 0 1px 1px rgba(255,255,255,.16), inset 0 -1px 1px rgba(255,255,255,.04);
  --drop:0 12px 32px rgba(0,0,0,.4);
  --sheen:.18;
  --b1:#0c7a54; --b2:#12507f; --b3:#4a2f8a; --b4:#6b5410;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-weight:400}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.wrap{max-width:520px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

/* fundo com manchas de cor */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.85;will-change:transform}
.blob:nth-child(1){background:var(--b1);top:-30vmax;left:-25vmax;animation:d1 22s ease-in-out infinite alternate}
.blob:nth-child(2){background:var(--b2);top:-10vmax;right:-35vmax;animation:d2 26s ease-in-out infinite alternate}
.blob:nth-child(3){background:var(--b3);bottom:-35vmax;left:-20vmax;animation:d3 30s ease-in-out infinite alternate}
.blob:nth-child(4){background:var(--b4);bottom:-25vmax;right:-30vmax;width:50vmax;height:50vmax;animation:d1 28s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(18vmax,22vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(-20vmax,25vmax) scale(.9)}}
@keyframes d3{to{transform:translate(22vmax,-18vmax) scale(1.15)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none!important}}

/* vidro */
.card,.list,.stat,.monthnav button,.search,nav.tabs,.toast,.icon-btn,.filter{
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--stroke);
  box-shadow:var(--hl),var(--drop);
  position:relative;
}
.card::before,.list::before,.stat::before,nav.tabs::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--sheen);
  background:linear-gradient(135deg,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 72%,rgba(255,255,255,.22) 100%);
}

header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 14px rgba(11,158,107,.35)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

.card{border-radius:26px;padding:18px;margin-bottom:14px}
.hero{padding:22px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 20%,transparent),transparent 65%),var(--glass)}
.hero .lbl{color:var(--mut);font-size:14px}
.hero .big{font-size:44px;font-weight:600;letter-spacing:-.04em;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
.hero .sub span{padding:5px 10px;border-radius:99px;background:var(--chip);border:1px solid var(--stroke)}
.up{color:var(--neg)} .down{color:var(--acc)}

.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:1px solid var(--stroke);background:var(--chip);border-radius:18px;padding:14px 16px;font-size:16px;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.add input:focus{border-color:var(--acc);background:var(--glass-strong)}
.add button{border-radius:18px;padding:0 20px;font-weight:600;color:var(--acc-ink);
  background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.add button:disabled{opacity:.35;box-shadow:none}
.preview{min-height:22px;margin:12px 4px 0;font-size:14px;color:var(--mut)}
.preview b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -18px 0;padding:2px 18px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--chip);font-size:13px;white-space:nowrap;border:1px solid var(--stroke);transition:.15s}
.chip .ci{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.chip .ci svg{width:14px;height:14px}
.chip.on{background:var(--c);color:#fff;border-color:transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 12px color-mix(in srgb,var(--c) 40%,transparent)}
.chip.on .ci{color:#fff;background:rgba(255,255,255,.25)}
.hint{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}

h2{font-size:15px;font-weight:600;margin:24px 6px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mut);font-size:12px}
h2 button{color:var(--acc);font-size:13px;font-weight:500}

.list{border-radius:26px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative}
.item + .item::after{content:'';position:absolute;top:0;left:66px;right:16px;height:1px;background:var(--sep)}
.item:active{background:var(--chip)}
.badge{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.08),0 4px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.badge svg{width:20px;height:20px}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut);font-size:12px}
.item .v{font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:30px 18px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:18px 8px 8px}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.monthnav b{font-size:18px;font-weight:600;text-transform:capitalize}
.monthnav button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.monthnav button:disabled{opacity:.3}

.bars .row{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--sep)}
.bars .row:first-child{border-top:0;padding-top:0}
.bars .top{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:8px}
.bars .top .nm{flex:1}
.bars .top em{font-style:normal;color:var(--mut);font-size:12px;width:36px;text-align:right}
.bars .top b{font-weight:600;font-variant-numeric:tabular-nums}
.mini{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));box-shadow:inset 0 1px 1px rgba(255,255,255,.55)}
.mini svg{width:16px;height:16px}
.track{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c))}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px 15px}
.stat small{display:block;color:var(--mut);font-size:12px}
.stat b{display:block;font-size:18px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.months{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:6px}
.months .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.months .colbar{width:100%;max-width:36px;border-radius:12px 12px 6px 6px;background:var(--chip);border:1px solid var(--stroke);min-height:6px}
.months .col.cur .colbar{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:transparent;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 6px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
.months small{font-size:11px;color:var(--mut);text-transform:capitalize}
.months .val{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}

.search{width:100%;border-radius:20px;padding:13px 16px;font-size:15px;outline:none;margin-bottom:4px}
.filter{display:flex;align-items:center;justify-content:space-between;border-radius:16px;padding:10px 14px;font-size:13px;margin:8px 0 0}
.filter button{color:var(--acc);font-weight:600}

nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:6px;border-radius:999px;z-index:5}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);padding:7px 18px 6px;border-radius:999px;font-size:11px;font-weight:500;transition:.2s;position:relative;z-index:1}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc);background:var(--glass-strong);box-shadow:var(--hl),0 2px 8px rgba(0,0,0,.06)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:10;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{width:calc(100% - 16px);max-width:520px;margin-bottom:calc(8px + env(safe-area-inset-bottom));border-radius:32px;padding:10px 18px 20px;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1);max-height:88dvh;overflow:auto;
  background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);border:1px solid var(--stroke);box-shadow:var(--hl),0 20px 50px rgba(0,0,0,.25)}
.scrim.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--sep);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px 4px}
.field input{width:100%;border:1px solid var(--stroke);background:var(--chip);border-radius:16px;padding:12px 14px;font-size:16px;outline:none}
.field input:focus{border-color:var(--acc)}
.field .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.btns{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;padding:15px;border-radius:18px;font-weight:600;background:var(--chip);border:1px solid var(--stroke);text-align:center}
.btn.pri{color:var(--acc-ink);border-color:transparent;background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 1px rgba(255,255,255,.55)}
.btn.danger{color:var(--neg)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-top:1px solid var(--sep);font-size:15px;text-align:left}
.opt:first-of-type{border-top:0}
.opt small{color:var(--mut)}
.seg{display:flex;background:var(--chip);border:1px solid var(--stroke);border-radius:99px;padding:3px}
.seg button{padding:6px 12px;border-radius:99px;font-size:13px}
.seg button.on{background:var(--glass-strong);box-shadow:var(--hl),0 2px 6px rgba(0,0,0,.08)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:11px 14px 11px 18px;border-radius:99px;font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap;background:var(--glass-strong)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--acc);font-weight:600}

/* ---- v3: dividir, parcelas, renda, objetivos, entradas ---- */
.pos{color:var(--acc)}
.explain{font-size:12.5px;color:var(--mut);line-height:1.5}
.usage-wrap{margin:12px 0 8px}
.usage{height:10px;border-radius:99px;background:var(--chip);position:relative;overflow:visible;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.usage>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.usage.warn>div{background:linear-gradient(90deg,#ffc35a,#f08a3c)}
.usage.over>div{background:linear-gradient(90deg,#ff8a7a,var(--neg))}
.usage i{position:absolute;top:-3px;width:2px;height:16px;border-radius:2px;background:var(--ink);opacity:.35;transform:translateX(-1px)}
.usage-l{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-top:7px;gap:8px}
.usage-l button{color:var(--mut);font-size:12.5px}
.usage-l b{color:var(--ink);font-weight:600}
.usage-p{font-size:12.5px;color:var(--mut);margin-top:4px}
.usage-p b{color:var(--ink);font-weight:600}
.usage-p b.up{color:var(--neg)}
.hero .sub:empty{display:none}
.incomecta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:12px 0 4px;padding:12px 14px;border-radius:18px;background:var(--chip);border:1px dashed color-mix(in srgb,var(--acc) 55%,transparent)}
.incomecta svg{width:26px;height:26px;color:var(--acc);flex:none}
.incomecta b{display:block;font-weight:600;font-size:14px}
.incomecta small{display:block;color:var(--mut);font-size:12px}

.opts{display:flex;gap:8px;margin-top:12px}
.tg{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--chip);border:1px solid var(--stroke);font-size:13px;font-weight:500}
.tg svg{width:16px;height:16px}
.tg.on{background:var(--ink);color:var(--bg);border-color:transparent}
.tg.wide{width:100%;justify-content:center;padding:11px;margin-top:2px}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:8px 6px 8px 14px;border-radius:16px;background:var(--chip);border:1px solid var(--stroke);font-size:14px}
.stp{display:flex;align-items:center;gap:4px}
.stp b{min-width:92px;text-align:center;font-weight:600;font-size:14px}
.stp button{width:34px;height:34px;border-radius:50%;background:var(--glass-strong);box-shadow:var(--hl),0 1px 3px rgba(0,0,0,.08);font-size:18px;line-height:1}

.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:2px 7px 2px 5px;border-radius:99px;background:var(--chip);border:1px solid var(--stroke);color:var(--mut)}
.tag svg{width:12px;height:12px}
.item .v{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .v .of{font-size:11px;color:var(--mut);font-weight:400}
.mbtn{margin-top:4px;padding:5px 10px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-size:11.5px;font-weight:600}
.more{display:block;width:100%;margin-top:10px;padding:12px;border-radius:18px;color:var(--acc);font-weight:600;font-size:14px}
.edithint{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin:12px 6px 0}
.edithint svg{width:14px;height:14px}

.seg2{display:flex;padding:4px;border-radius:99px;margin-bottom:14px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--stroke);box-shadow:var(--hl),var(--drop)}
.seg2 button{flex:1;padding:10px;border-radius:99px;font-size:14px;font-weight:500;color:var(--mut)}
.seg2 button.on{background:var(--glass-strong);color:var(--ink);box-shadow:var(--hl),0 2px 8px rgba(0,0,0,.08)}

.pbar{height:4px;border-radius:9px;background:var(--chip);margin-top:6px;overflow:hidden}
.pbar>div{height:100%;background:var(--c);border-radius:9px}
.ahead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ahead div{padding:10px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.ahead small{display:block;font-size:11px;color:var(--mut);text-transform:capitalize}
.ahead b{font-size:14px;font-weight:600}
.ahead span{grid-column:1/-1;font-size:11.5px;color:var(--mut);text-align:center}
.months .col{background:none;border:0}

.tips{padding:6px 16px}
.tip{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--sep)}
.tip:first-child{border-top:0}
.tip span{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#a77400;background:color-mix(in srgb,#ffc84a 30%,transparent)}
.tip span svg{width:17px;height:17px}
.tip p{margin:0;font-size:13.5px;line-height:1.5}
.tip b{font-weight:600}

.goal .gh{display:flex;align-items:center;gap:12px}
.gico{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 1px rgba(255,255,255,.55),0 6px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
.gico svg{width:22px;height:22px}
.goal .t{flex:1;min-width:0}
.goal .t b{display:block;font-size:16px;font-weight:600}
.goal .t small{color:var(--mut);font-size:12.5px}
.icon-btn.sm{width:36px;height:36px}
.icon-btn.sm svg{width:17px;height:17px}
.track.gt{height:12px;margin:14px 0 6px;--c:var(--acc)}
.gline{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.gneed{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 0;padding:12px 14px;border-radius:16px;background:var(--chip);border:1px solid var(--stroke)}
.gneed small{color:var(--mut);font-size:13px}

.inhero{background:linear-gradient(135deg,color-mix(in srgb,#3ee3a3 26%,transparent),transparent 70%),var(--glass)}

.flow div{padding:10px 12px;border-radius:16px;background:var(--chip);border:1px solid var(--stroke)}
.flow small{display:block;font-size:11px;color:var(--mut)}

.flow b.up{color:var(--neg)}
.inbtn{white-space:nowrap}

.hright{display:flex;align-items:center;gap:8px}
.acct{width:38px;height:38px;border-radius:50%;padding:2px;position:relative;background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--hl),var(--drop)}
.acct img,.acct span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;object-fit:cover;font-weight:600;font-size:15px;background:var(--acc);color:var(--acc-ink)}
.acct::after{content:'';position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);background:var(--acc)}

  saude:  '<path d="M19.5 12.6 12 20l-7.5-7.4A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 7.5 6z"/><path d="M7.5 12.5h2.2l1.3-2.2 2 4 1.3-1.8h2.2"/>',

};
const ico = id => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[id] || ICONS.outros}</svg>`;
Object.assign(ICONS, {
  split: '<circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><path d="M13.5 15.2c.8-.5 1.6-.7 2.5-.7 3 0 5.5 2.2 5.5 5.5"/>',

  wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 14h.01"/>',

  coin:  '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.5-1.3-2.8-1.3-1.6 0-2.8.8-2.8 2s1.2 1.7 2.8 2.1 2.8.9 2.8 2.1-1.2 2-2.8 2c-1.4 0-2.4-.5-2.9-1.4M12 6.3v1.6M12 16.1v1.6"/>',

const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const STOP = new Set(['gastei','paguei','gasto','foi','deu','reais','real','no','na','nos','nas','em','com','de','do','da','dos','das','pro','pra','para','o','a','os','as','um','uma','e','hoje','ontem','anteontem','rs']);
const ESSENC = ['merc','casa','saude','transp','edu','pet'];
const CUTS = { alcool:.5, alim:.25, lazer:.4, compras:.4, beleza:.3, assin:.5, outros:.2, transp:.15 };

/* ---------- estado ---------- */
const KEY = 'grana-v1';
let S = load();
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  s = s && s.items ? s : {};
  return { v:2, items:s.items || [], learned:s.learned || {}, income:s.income || 0, goals:s.goals || [], incomes:s.incomes || [], del:s.del || [] };
}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function save(){ saveLocal(); schedulePush(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const ui = { tab:'inicio', month: ym(today()), draft:'', pick:null, split:null, inst:null, q:'', cat:null, view:'mes', idraft:'', ipick:null };

/* ---------- datas e dinheiro ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addDays(s, n){ const d = new Date(s+'T12:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ym(s){ return s.slice(0,7); }
function addMonths(m, n){ let [y,mo] = m.split('-').map(Number); mo += n; while(mo<1){mo+=12;y--} while(mo>12){mo-=12;y++} return `${y}-${pad(mo)}`; }
function mdiff(a, b){ const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number); return (by-ay)*12 + (bm-am); }
function monthName(m, short){ const d = new Date(m+'-15T12:00'); return d.toLocaleDateString('pt-BR', short ? {month:'short'} : {month:'long'}).replace('.',''); }
function monthYear(m){ return monthName(m, true) + (m.slice(0,4) !== today().slice(0,4) ? '/' + m.slice(2,4) : ''); }
function daysIn(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
function dayLabel(s){
  if (s === today()) return 'hoje';
  if (s === addDays(today(),-1)) return 'ontem';
  const d = new Date(s+'T12:00');
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'short'}).replace('.','');
}
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = c => BRL.format(c/100);
const money0 = c => 'R$ ' + Math.round(c/100).toLocaleString('pt-BR');
const moneyShort = c => c >= 100000 ? 'R$ ' + (c/100000).toFixed(1).replace('.',',') + 'k' : 'R$ ' + Math.round(c/100);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function parseMoney(raw){
  raw = String(raw || '').replace(/r\$/i,'').trim();
  if (!raw) return 0;
  const v = raw.includes(',') ? parseFloat(raw.replace(/\./g,'').replace(',','.')) : (/^\d{1,3}(\.\d{3})+$/.test(raw) ? parseFloat(raw.replace(/\./g,'')) : parseFloat(raw));
  return v > 0 ? Math.round(v*100) : 0;
}
const fmtInput = c => c ? (c/100).toFixed(2).replace('.',',') : '';

/* ---------- entender o texto ---------- */
function isKeyword(tok){ return CATS.some(c => c.kw.includes(tok)); }
function parse(raw){
  let text = ' ' + raw + ' ';
  let date = today(), split = 0, inst = 0, m;
  const n0 = norm(text);
  if (/\banteontem\b/.test(n0)) { date = addDays(today(),-2); text = text.replace(/anteontem/i,' '); }
  else if (/\bontem\b/.test(n0)) { date = addDays(today(),-1); text = text.replace(/ontem/i,' '); }
  // parcelas: "em 3x", "3x", "10 vezes", "parcelado em 4"
  if ((m = text.match(/\s(?:parcelad[oa]\s+)?(?:em\s+)?(\d{1,2})\s*(?:x|vezes)(?=\s)/i)) && +m[1] >= 2) { inst = +m[1]; text = text.replace(m[0], ' '); }
  else if ((m = text.match(/\sparcelad[oa]\s+em\s+(\d{1,2})(?=\s)/i)) && +m[1] >= 2) { inst = +m[1]; text = text.replace(m[0], ' '); }
  // divisão: "dividi em 3", "dividido por 2", "dividi com 2 pessoas", "dividi com a ana", "/2"
  if ((m = text.match(/\sdivid(?:i|ido|ida)\s+(?:em|por|entre)\s+(\d{1,2})(?:\s+pessoas)?(?=\s)/i))) { split = +m[1]; text = text.replace(m[0], ' '); }
  else if ((m = text.match(/\sdivid(?:i|ido|ida)\s+com\s+(\d{1,2})(?:\s+pessoas?)?(?=\s)/i))) { split = +m[1] + 1; text = text.replace(m[0], ' '); }
  else if ((m = text.match(/\sdivid(?:i|ido|ida)(?:\s+com\s+(?:a|o)?\s*[a-zà-ú]+)?(?=\s)/i))) { split = 2; text = text.replace(m[0], ' '); }
  else if ((m = text.match(/\s\/\s*(\d{1,2})(?=\s)/))) { split = +m[1]; text = text.replace(m[0], ' '); }
  if (split < 2) split = 0;

  const re = /(r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?!\d)/gi;
  const found = [];
  while ((m = re.exec(text))) {
    const s = m[2];
    let val;
    if (s.includes(',')) val = parseFloat(s.replace(/\./g,'').replace(',','.'));
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) val = parseFloat(s.replace(/\./g,''));
    else val = parseFloat(s);
    found.push({ val, idx:m.index, len:m[0].length, rs:!!m[1], raw:s });
  }
  let pick = found.find(f => f.rs) || null;
  if (!pick) {
    const cands = found.length > 1 ? found.filter(f => !isKeyword(f.raw)) : found;
    for (const f of cands) if (!pick || f.val > pick.val) pick = f;
  }
  let desc = text;
  if (pick) desc = text.slice(0, pick.idx) + ' ' + text.slice(pick.idx + pick.len);
  desc = desc.replace(/\b(reais|real)\b/gi,' ').replace(/\s+/g,' ').trim();
  for (;;) {
    const ws = desc.split(' ');
    if (ws.length > 1 && STOP.has(norm(ws[0]))) desc = ws.slice(1).join(' ');
    else if (ws.length > 1 && STOP.has(norm(ws[ws.length-1]))) desc = ws.slice(0,-1).join(' ');
    else break;
  }
  if (STOP.has(norm(desc))) desc = '';
  let cat = guessCat(desc);
  if (inst && cat === 'assin') cat = 'compras'; // "celular 2400 em 10x" é compra, não plano
  return { amt: pick ? Math.round(pick.val*100) : 0, desc, date, cat, split, inst };
}
function words(desc){ return norm(desc).split(/[^a-z0-9]+/).filter(w => w.length >= 2 && !STOP.has(w)); }
function guessCat(desc){
  if (!desc) return 'outros';
  for (const w of words(desc)) if (S.learned[w]) return S.learned[w];
  const toks = norm(desc).split(/[^a-z0-9]+/).filter(Boolean);
  const padded = ' ' + toks.join(' ') + ' ' + toks.map(w => w.length > 3 ? w.replace(/e?s$/,'') : w).join(' ') + ' ';
  for (const c of CATS) for (const k of c.kw) if (padded.includes(' ' + k + ' ')) return c.id;
  return 'outros';
}
function learn(desc, cat){ for (const w of words(desc)) if (w.length >= 3) S.learned[w] = cat; }

/* ---------- contas ---------- */
// sua parte do gasto (se dividiu, só o que é seu)
const share = i => i.split ? i.split.mine : i.amt;
// quanto o gasto pesa num mês (à vista no mês da compra; parcelado espalhado pelos meses)
function charge(i, m){
  if (i.inst > 1) {
    const k = mdiff(ym(i.date), m);
    if (k < 0 || k >= i.inst) return 0;
    const base = Math.floor(share(i) / i.inst);
    return k === i.inst - 1 ? share(i) - base * (i.inst - 1) : base;
  }
  return ym(i.date) === m ? share(i) : 0;
}
const value = (i, m, view) => view === 'total' ? (ym(i.date) === m ? share(i) : 0) : charge(i, m);
const monthTotal = (m, view='mes') => S.items.reduce((a,i) => a + value(i, m, view), 0);
const sum = arr => arr.reduce((a,i) => a + i.amt, 0);
function byCat(m, view){
  const t = {};
  for (const i of S.items) { const v = value(i, m, view); if (v) t[i.cat] = (t[i.cat]||0) + v; }
  return Object.entries(t).sort((a,b) => b[1]-a[1]);
}
const sortItems = arr => arr.slice().sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
const instOf = i => { const b = Math.floor(share(i)/i.inst); return b; };
// gastos que não se repetem no ritmo do dia a dia (parcelas, contas da casa, assinaturas, compras grandes)
const fixedish = i => i.inst > 1 || ['casa','assin','edu'].includes(i.cat) || share(i) >= 30000;
// projeção do mês atual: à vista no ritmo de hoje + parcelas do mês
function projection(m){
  if (m !== ym(today())) return monthTotal(m);
  const d = Number(today().slice(8)), f = daysIn(m) / d;
  return S.items.reduce((a,i) => a + (fixedish(i) ? charge(i,m) : Math.round(charge(i,m) * f)), 0);
}
// meses usados para médias: até 3 meses anteriores com gastos
function baseMonths(){
  const cur = ym(today()), ms = [];
  for (let k = 1; k <= 3; k++) { const m = addMonths(cur,-k); if (S.items.some(i => charge(i,m) > 0)) ms.push(m); }
  return ms;
}
function avgSpend(cat){
  const f = i => !cat || i.cat === cat, ms = baseMonths();
  if (ms.length) return Math.round(ms.reduce((a,m) => a + S.items.filter(f).reduce((b,i) => b + charge(i,m), 0), 0) / ms.length);
  const cur = ym(today()), k = daysIn(cur) / Number(today().slice(8));
  return Math.round(S.items.filter(f).reduce((b,i) => b + (fixedish(i) ? charge(i,cur) : charge(i,cur) * k), 0));
}
const gotIn = m => S.incomes.reduce((a,x) => a + (ym(x.date) === m ? x.amt : 0), 0);
// ganho do mês: o que entrou de fato; enquanto o mês não fechou, no mínimo o previsto
function incomeFor(m){ const g = gotIn(m); return m < ym(today()) ? (g || S.income) : Math.max(g, S.income); }
// ganho de referência para objetivos: o previsto, ou a média do que entrou nos últimos meses
function incomeRef(){
  if (S.income) return S.income;
  const ms = [1,2,3].map(k => addMonths(ym(today()),-k)).filter(m => gotIn(m));
  return ms.length ? Math.round(ms.reduce((a,m) => a + gotIn(m), 0) / ms.length) : gotIn(ym(today()));
}
const sobra = () => incomeRef() - avgSpend();
const owed = () => S.items.filter(i => i.split && !i.split.paid);

/* ---------- objetivos ---------- */
const monthsLeft = g => g.deadline ? Math.max(1, mdiff(ym(today()), g.deadline) + 1) : 0;
const needOf = g => { const left = Math.max(0, g.target - g.saved), n = monthsLeft(g); return n ? Math.ceil(left / n / 100) * 100 : 0; };
function cutsFor(gap){
  const list = Object.entries(CUTS).map(([c,p]) => { const avg = avgSpend(c); return { c, avg, p, max: Math.round(avg*p/100)*100 }; })
    .filter(x => x.max >= 1000).sort((a,b) => b.max - a.max);
  const out = []; let left = gap;
  for (const x of list) { if (left <= 0) break; const take = Math.min(x.max, Math.ceil(left/100)*100); out.push({ ...x, take }); left -= take; }
  return { out, left: Math.max(0, left) };
}

/* ---------- dicas ---------- */
function tips(m){
  const inc = incomeFor(m), out = [], total = monthTotal(m), cats = Object.fromEntries(byCat(m,'mes'));
  const inM = S.items.filter(i => ym(i.date) === m);
  const isCur = m === ym(today());
  const proj = projection(m);
  if (inc) {
    if (isCur && proj > inc) out.push(`No ritmo atual você fecha o mês em <b>${money0(proj)}</b>, ${money0(proj - inc)} acima do que ganha. Segure os gastos que dá para adiar até o mês que vem.`);
    const ess = ESSENC.reduce((a,c) => a + (cats[c]||0), 0), des = total - ess;
    const pe = Math.round(ess / inc * 100), pd = Math.round(des / inc * 100);
    if (pd > 30) out.push(`Gastos com desejos (delivery, lazer, álcool, compras, beleza, assinaturas) estão em <b>${pd}% da sua renda</b>. A regra 50/30/20 sugere até 30%; baixar para isso libera ${money0(des - inc*.3)} por mês.`);
    else if (pe > 50) out.push(`O essencial (casa, mercado, transporte, saúde) já leva <b>${pe}% da renda</b>. Vale renegociar contas fixas, como plano de celular, internet ou seguro.`);
    else if (!isCur || Number(today().slice(8)) > 20) out.push(`Você está dentro da regra 50/30/20: ${pe}% no essencial e ${pd}% em desejos. Tente separar 20% (${money0(inc*.2)}) logo que o dinheiro cair.`);
    const next = monthTotal(addMonths(ym(today()),1));
    const nextInst = S.items.reduce((a,i) => a + (i.inst > 1 ? charge(i, addMonths(ym(today()),1)) : 0), 0);
    if (nextInst && nextInst > inc * .2) out.push(`Você já tem <b>${money0(nextInst)}</b> de parcelas no mês que vem (${Math.round(nextInst/inc*100)}% da renda). Evite parcelar mais coisas até algumas terminarem.`);
  }
  const deliv = inM.filter(i => /ifood|rappi|delivery|99food|aiqfome/.test(norm(i.desc)));
  if (deliv.length >= 3) { const v = deliv.reduce((a,i) => a + share(i), 0); out.push(`Foram <b>${deliv.length} pedidos de delivery</b> (${money0(v)}). Trocar metade por comida feita em casa economiza perto de ${money0(v*.35)} no mês.`); }
  if (cats.alcool) {
    const n = inM.filter(i => i.cat === 'alcool').length;
    out.push(`Álcool: <b>${money0(cats.alcool)}</b> no mês${n > 1 ? ` em ${n} vezes` : ''}${inc ? `, ${Math.round(cats.alcool/inc*100)}% da renda` : ''}. No ritmo de um ano, dá ${money0(cats.alcool*12)}.`);
  }
  const small = inM.filter(i => share(i) < 2000 && !i.inst);
  if (small.length >= 5) out.push(`Gastos pequenos, de menos de R$ 20, aconteceram <b>${small.length} vezes</b> e somaram ${money0(small.reduce((a,i) => a + share(i),0))}. Eles passam despercebidos, então vale ter um limite semanal para eles.`);
  if (cats.assin) out.push(`Assinaturas custam <b>${money0(cats.assin)} por mês</b>, ou ${money0(cats.assin*12)} por ano. Cancele o que não usou nos últimos 30 dias.`);
  const top = byCat(m,'mes')[0];
  if (top && total && top[1]/total > .4 && !['casa'].includes(top[0])) out.push(`${CAT[top[0]].name} levou <b>${Math.round(top[1]/total*100)}%</b> do mês. Cortar 20% dessa categoria já economiza ${money0(top[1]*.2)}.`);
  const ow = owed();
  if (ow.length) out.push(`Te devem <b>${money0(ow.reduce((a,i) => a + i.amt - i.split.mine, 0))}</b> de contas divididas. Cobre enquanto está fresco na memória.`);
  if (out.length < 2) out.push('Antes de uma compra que não estava nos planos, espere 48 horas. Metade das vezes a vontade passa.');
  if (out.length < 3) out.push('Guarde no começo do mês, assim que o dinheiro cair, e não o que sobrar no fim. Uma transferência automática ajuda.');
  return out.slice(0, 5);
}

function compareLine(m){
  const prevM = addMonths(m,-1), prev = monthTotal(prevM);
  if (!prev) return '';
  let cur = monthTotal(m), base = prev;
  if (m === ym(today())) {
    const d = Number(today().slice(8));
    const upTo = (mm) => S.items.reduce((a,i) => a + (i.inst > 1 ? charge(i,mm) : (Number(i.date.slice(8)) <= d ? charge(i,mm) : 0)), 0);
    base = upTo(prevM); cur = upTo(m);
    if (!base) return '';
  }
  const p = Math.round((cur - base) / base * 100);
  const lbl = m === ym(today()) ? 'vs. mesmo ponto do mês passado' : 'vs. ' + monthName(prevM);
  return `<span class="${p > 0 ? 'up' : 'down'}">${p > 0 ? '+' : ''}${p}% ${lbl}</span>`;
}

function incomeBlock(m){
  const inc = incomeFor(m), real = gotIn(m), total = monthTotal(m), isCur = m === ym(today());

  return `<div class="usage-wrap">

}

function effDraft(){

function stepper(key, label, val, unit){

function addFromDraft(){

      <button class="btn pri" data-newgoal>Criar objetivo</button>
    </div>`}

function goalCard(g){
  const left = Math.max(0, g.target - g.saved), pct = g.target ? Math.min(100, g.saved / g.target * 100) : 0;
  const n = monthsLeft(g), need = needOf(g);
  const others = S.goals.filter(x => x !== g).reduce((a,x) => a + needOf(x), 0);
  const free = sobra() - others;
  let verdict = '';
  if (!left) verdict = `<div class="verdict ok">Objetivo alcançado! ${ico('meta')}</div>`;
  else if (!incomeRef()) verdict = `<div class="verdict">Adicione seu ganho mensal para eu ver se cabe no seu orçamento.</div>`;
  else if (!n) {
    if (free > 0) { const k = Math.ceil(left / free); verdict = `<div class="verdict ok">Guardando toda a sua sobra livre (${money0(free)}/mês), você chega lá em <b>${k} ${k === 1 ? 'mês' : 'meses'}</b>, por volta de ${monthYear(addMonths(ym(today()), k-1))}.</div>`; }
    else verdict = `<div class="verdict bad">Hoje não sobra dinheiro livre. Veja onde cortar abaixo ou coloque um prazo.</div>` + cutsHTML(cutsFor(Math.max(10000, Math.ceil(left/12/100)*100)), true);
  } else if (need <= free) verdict = `<div class="verdict ok">Cabe! Guardando ${money0(need)} por mês ainda sobram ${money0(free - need)} livres.</div>`;
  else {
    const gap = need - Math.max(0, free);
    const c = cutsFor(gap);
    verdict = `<div class="verdict bad">Faltam <b>${money0(gap)} por mês</b> na sua sobra${free > 0 ? ` (hoje sobram ${money0(free)} livres)` : ''}.</div>` + cutsHTML(c);
    if (c.left > 0 && free > 0) { const k = Math.ceil(left / free); verdict += `<div class="verdict">Outra opção: só com a sobra atual, o prazo vira ${monthYear(addMonths(ym(today()), k-1))} (${k} meses).</div>`; }
  }
  return `<div class="card goal">
    <div class="gh"><div class="gico">${ico('meta')}</div>
      <div class="t"><b>${esc(g.name)}</b><small>${money0(g.saved)} de ${money0(g.target)}</small></div>
      <button class="icon-btn sm" data-editgoal="${g.id}" aria-label="Editar objetivo">${ico('pen')}</button></div>
    <div class="track gt"><div class="fill" style="width:${Math.max(pct,2)}%"></div></div>
    <div class="gline"><span>${Math.round(pct)}%</span><span>${n ? `até ${monthYear(g.deadline)} · ${n} ${n === 1 ? 'mês' : 'meses'}` : 'sem prazo'}</span></div>
    ${left && n ? `<div class="gneed"><small>Guarde por mês</small><b>${money0(need)}</b></div>` : ''}
    ${verdict}
    ${left ? `<button class="btn pri sm" data-deposit="${g.id}">${ico('coin')}Guardei dinheiro</button>` : ''}
  </div>`;
}
function cutsHTML(c, noTitle){
  if (!c.out.length) return `<div class="verdict">Ainda não tenho gastos suficientes para sugerir cortes. Continue lançando por algumas semanas.</div>`;
  return `<div class="cuts"><small>${noTitle ? 'Sugestões de corte' : 'De onde tirar'}:</small>${c.out.map(x => `
    <div class="cut" style="--c:${CAT[x.c].color}"><span class="mini">${ico(x.c)}</span><span class="nm">${CAT[x.c].name}<small>de ${money0(x.avg)} para ${money0(x.avg - x.take)}</small></span><b>−${money0(x.take)}</b></div>`).join('')}
    ${c.left > 0 ? `<p>Mesmo cortando tudo isso faltariam ${money0(c.left)}/mês. Vale aumentar o prazo.</p>` : ''}</div>`;
}

function guessType(desc){

function inDraft(){ const p = ui.idraft.trim() ? parse(ui.idraft) : null; return { p, type: ui.ipick || (p ? guessType(p.desc) : null) }; }
function refreshIn(){
  const { p, type } = inDraft();
  let html = 'Digite o valor e de onde veio.';
  if (p && !p.amt) html = 'Faltou o valor.';
  else if (p) html = `<b class="pos">+${money(p.amt)}</b> · ${p.desc && norm(p.desc) !== norm(INT[type].name) ? esc(cap(p.desc)) + ' · ' : ''}${INT[type].name}${p.date !== today() ? ' · ' + dayLabel(p.date) : ''}`;
  document.getElementById('ipreview').innerHTML = html;
  document.getElementById('inBtn').disabled = !(p && p.amt);
  document.querySelectorAll('#ichips .chip').forEach(b => b.classList.toggle('on', b.dataset.type === type));
}
function addEntry(){
  const { p, type } = inDraft();
  if (!p || !p.amt) return;
  const x = { id: uid(), amt:p.amt, desc:p.desc, type, date:p.date, ts:Date.now() };
  S.incomes.push(x); save();
  ui.idraft = ''; ui.ipick = null; render();
  document.getElementById('idraft').focus();
  toast(`+${money(x.amt)} em ${INT[type].name}`, () => { S.incomes = S.incomes.filter(y => y.id !== x.id); kill(x.id); save(); render(); });
}
function openEntry(id){
  const x = S.incomes.find(y => y.id === id); if (!x) return;
  let type = x.type;
  openSheet(`
    <h3>Editar entrada</h3>
    <div class="field"><label>Valor</label><input id="nAmt" inputmode="decimal" value="${fmtInput(x.amt)}"></div>

    <div class="field"><label>Data</label><input id="nDate" type="date" value="${x.date}" max="${today()}"></div>
    <div class="field"><label>Tipo</label><div class="chips" id="nTypes">${INTYPES.map(t => `<button class="chip ${t.id===type?'on':''}" data-type="${t.id}" style="--c:${t.color}"><span class="ci">${ico(t.id)}</span>${t.name}</button>`).join('')}</div></div>
    <div class="btns"><button class="btn danger" id="nDel">Apagar</button><button class="btn pri" id="nSave">Salvar</button></div>`);
  document.getElementById('nTypes').addEventListener('click', e => {
    const b = e.target.closest('[data-type]'); if (!b) return;
    type = b.dataset.type; document.querySelectorAll('#nTypes .chip').forEach(c => c.classList.toggle('on', c === b));
  });
  document.getElementById('nSave').onclick = () => {
    const v = parseMoney(document.getElementById('nAmt').value); if (!v) return document.getElementById('nAmt').focus();
    Object.assign(x, { amt:v, desc:document.getElementById('nDesc').value.trim(), date:document.getElementById('nDate').value || x.date, type });
    save(); closeSheet(); render(); toast('Entrada atualizada');
  };
  document.getElementById('nDel').onclick = () => {
    const idx = S.incomes.indexOf(x); S.incomes.splice(idx, 1); kill(x.id); save(); closeSheet(); render();
    toast('Entrada apagada', () => { S.incomes.splice(idx, 0, x); revive(x.id); save(); render(); });
  };
}

const $scrim = document.getElementById('scrim'), $sheet = document.getElementById('sheet');

function openEdit(id){
  const i = S.items.find(x => x.id === id); if (!i) return;
  const e = { cat:i.cat, split: i.split ? { ...i.split } : null, inst: i.inst || 0, mineTouched: false };
  openSheet(`
    <h3>Editar gasto</h3>
    <div class="field"><label>Valor total</label><input id="eAmt" inputmode="decimal" value="${fmtInput(i.amt)}"></div>
    <div class="field"><label>Descrição</label><input id="eDesc" value="${esc(i.desc)}"></div>

    <div class="field"><label>Categoria</label><div class="chips" id="eCats">${CATS.map(c => `<button class="chip ${c.id===e.cat?'on':''}" data-cat="${c.id}" style="--c:${c.color}"><span class="ci">${ico(c.id)}</span>${c.name}</button>`).join('')}</div></div>
    <div id="eOpts"></div>
    <div class="btns"><button class="btn danger" id="eDel">Apagar</button><button class="btn pri" id="eSave">Salvar</button></div>
  `);
  const amtNow = () => parseMoney(document.getElementById('eAmt').value);
  function drawOpts(){
    const box = document.getElementById('eOpts');
    box.innerHTML = `
      <div class="opts"><button type="button" class="tg ${e.split?'on':''}" data-opt="split">${ico('split')}Dividi</button><button type="button" class="tg ${e.inst?'on':''}" data-opt="inst">${ico('card')}Parcelei</button></div>
      ${e.split ? stepper('split', 'Dividido entre', e.split.n, 'pessoas') + `
        <div class="field" style="margin-top:10px"><label>Minha parte</label><input id="eMine" inputmode="decimal" value="${fmtInput(e.split.mine)}"></div>
        <button type="button" class="tg wide ${e.split.paid?'on':''}" data-opt="paid">${ico('coin')}${e.split.paid ? 'Já me pagaram' : 'Ainda não me pagaram'}</button>` : ''}
      ${e.inst ? stepper('inst', 'Parcelado em', e.inst, 'vezes') : ''}
      <div style="height:14px"></div>`;
    const mi = document.getElementById('eMine');
    if (mi) mi.oninput = () => { e.mineTouched = true; e.split.mine = parseMoney(mi.value); };
  }
  drawOpts();
  document.getElementById('eAmt').oninput = () => { if (e.split && !e.mineTouched) { e.split.mine = Math.round(amtNow()/e.split.n); const mi = document.getElementById('eMine'); if (mi) mi.value = fmtInput(e.split.mine); } };
  document.getElementById('eOpts').addEventListener('click', ev => {
    const b = ev.target.closest('[data-opt],[data-step]'); if (!b) return;
    if (b.dataset.opt === 'split') e.split = e.split ? null : { n:2, mine:Math.round(amtNow()/2), paid:false };
    else if (b.dataset.opt === 'inst') e.inst = e.inst ? 0 : 3;
    else if (b.dataset.opt === 'paid') e.split.paid = !e.split.paid;
    else if (b.dataset.step === 'split') { e.split.n = clamp(e.split.n + Number(b.dataset.d), 2, 20); e.split.mine = Math.round(amtNow()/e.split.n); e.mineTouched = false; }
    else if (b.dataset.step === 'inst') e.inst = clamp(e.inst + Number(b.dataset.d), 2, 24);
    drawOpts();
  });
  document.getElementById('eCats').addEventListener('click', ev => {
    const b = ev.target.closest('[data-cat]'); if (!b) return;
    e.cat = b.dataset.cat;
    document.querySelectorAll('#eCats .chip').forEach(x => x.classList.toggle('on', x.dataset.cat === e.cat));
  });
  document.getElementById('eSave').onclick = () => {
    const v = amtNow();
    if (!v) { document.getElementById('eAmt').focus(); return; }
    i.amt = v;
    i.desc = document.getElementById('eDesc').value.trim();
    i.date = document.getElementById('eDate').value || i.date;
    if (e.cat !== i.cat && i.desc) learn(i.desc, e.cat);
    i.cat = e.cat;
    if (e.split) { e.split.mine = clamp(e.split.mine || Math.round(v/e.split.n), 1, v); i.split = e.split; } else delete i.split;
    if (e.inst) i.inst = e.inst; else delete i.inst;
    save(); closeSheet(); render(); toast('Gasto atualizado');
  };
  document.getElementById('eDel').onclick = () => {
    const idx = S.items.indexOf(i);
    S.items.splice(idx, 1); kill(i.id); save(); closeSheet(); render();
    toast('Gasto apagado', () => { S.items.splice(idx, 0, i); revive(i.id); save(); render(); });
  };
}

function openIncome(){
  openSheet(`
    <h3>Ganho mensal previsto</h3>
    <p class="sheetp">Quanto costuma entrar por mês, já descontado. Se varia, coloque uma média. Ele vale enquanto as entradas do mês não chegam; quando você lança na aba Entradas, o app usa o que entrou de verdade.</p>
    <div class="field"><label>Valor</label><input id="inc" inputmode="decimal" placeholder="ex: 4.500,00" value="${fmtInput(S.income)}"></div>
    <div class="btns">${S.income ? '<button class="btn danger" id="incDel">Remover</button>' : ''}<button class="btn pri" id="incSave">Salvar</button></div>`);
  const inp = document.getElementById('inc'); setTimeout(() => inp.focus(), 250);
  document.getElementById('incSave').onclick = () => { S.income = parseMoney(inp.value); save(); closeSheet(); render(); };
  const d = document.getElementById('incDel'); if (d) d.onclick = () => { S.income = 0; save(); closeSheet(); render(); };
}

function openGoal(id){
  const g = S.goals.find(x => x.id === id);
  const minM = ym(today());
  openSheet(`
    <h3>${g ? 'Editar objetivo' : 'Novo objetivo'}</h3>
    <div class="field"><label>Nome</label><input id="gName" placeholder="ex: Viagem pra Noronha" value="${g ? esc(g.name) : ''}"></div>
    <div class="field"><label>Quanto custa</label><input id="gTarget" inputmode="decimal" placeholder="ex: 6.000,00" value="${g ? fmtInput(g.target) : ''}"></div>
    <div class="field"><label>Quanto você já tem guardado</label><input id="gSaved" inputmode="decimal" placeholder="0,00" value="${g ? fmtInput(g.saved) : ''}"></div>
    <div class="field"><label>Até quando (opcional)</label><input id="gDead" type="month" min="${minM}" value="${g ? g.deadline : ''}"></div>
    <div class="btns">${g ? '<button class="btn danger" id="gDel">Apagar</button>' : ''}<button class="btn pri" id="gSave">Salvar</button></div>`);
  document.getElementById('gSave').onclick = () => {
    const name = document.getElementById('gName').value.trim(), target = parseMoney(document.getElementById('gTarget').value);
    if (!name) return document.getElementById('gName').focus();
    if (!target) return document.getElementById('gTarget').focus();
    const data = { name, target, saved: parseMoney(document.getElementById('gSaved').value), deadline: document.getElementById('gDead').value || '' };
    if (g) Object.assign(g, data); else S.goals.push({ id: uid(), ...data });
    save(); closeSheet(); ui.tab = 'objetivos'; render();
  };
  const d = document.getElementById('gDel');
  if (d) d.onclick = () => { if (!confirm(`Apagar o objetivo "${g.name}"?`)) return; S.goals = S.goals.filter(x => x !== g); kill(g.id); save(); closeSheet(); render(); };
}
function openDeposit(id){
  const g = S.goals.find(x => x.id === id); if (!g) return;
  openSheet(`
    <h3>Guardei para ${esc(g.name)}</h3>
    <div class="field"><label>Quanto você guardou agora</label><input id="dep" inputmode="decimal" placeholder="${needOf(g) ? fmtInput(needOf(g)) : '0,00'}"></div>
    <div class="btns"><button class="btn" id="depOut">Tirei dinheiro</button><button class="btn pri" id="depIn">Guardar</button></div>`);
  const inp = document.getElementById('dep'); setTimeout(() => inp.focus(), 250);
  const apply = sign => { const v = parseMoney(inp.value) || (sign > 0 ? needOf(g) : 0); if (!v) return; g.saved = Math.max(0, g.saved + sign*v); save(); closeSheet(); render(); toast(sign > 0 ? `${money0(v)} guardados` : `${money0(v)} retirados`); };
  document.getElementById('depIn').onclick = () => apply(1);
  document.getElementById('depOut').onclick = () => apply(-1);
}

/* ---------- ajustes ---------- */
function getTheme(){ try { return localStorage.getItem('grana-theme') || 'auto'; } catch(e){ return 'auto'; } }
function applyTheme(t){
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#05090a' : '#e8f0ed';
}
function openSettings(){
  const t = getTheme();
  openSheet(`
    <h3>Ajustes</h3>
    ${accountBlock()}
    <button class="opt" data-income><span>Ganho mensal previsto</span><small>${S.income ? money0(S.income) : 'adicionar'}</small></button>
    <div class="opt"><span>Tema</span><div class="seg" id="seg">${[['auto','Auto'],['light','Claro'],['dark','Escuro']].map(([k,l]) => `<button data-th="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div></div>
    <button class="opt" id="exp"><span>Baixar backup</span><small>arquivo .json</small></button>
    <button class="opt" id="imp"><span>Restaurar backup</span><small>substitui os dados</small></button>
    <button class="opt" id="wipe" style="color:var(--neg)"><span>Apagar tudo</span></button>
    ${fb.user ? '' : '<div class="hint">Sem login, os dados ficam só neste aparelho. Faça backup de vez em quando ou entre com Google.</div>'}
    <input type="file" id="file" accept="application/json,.json" hidden>
  `);
  const so = document.getElementById('signout'); if (so) so.onclick = signOut;
  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('[data-th]'); if (!b) return;
    try { localStorage.setItem('grana-theme', b.dataset.th); } catch(err){}
    applyTheme(b.dataset.th);
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
  });
  document.getElementById('exp').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `grana-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const file = document.getElementById('file');
  document.getElementById('imp').onclick = () => file.click();
  file.onchange = async () => {
    try {
      const s = JSON.parse(await file.files[0].text());
      if (!s.items) throw 0;
      if (!confirm(`Restaurar ${s.items.length} gastos? Os dados atuais serão substituídos.`)) return;
      S = { v:2, items:s.items, learned:s.learned || {}, income:s.income || 0, goals:s.goals || [], incomes:s.incomes || [], del:S.del || [] }; save(); closeSheet(); render();
    } catch(e){ alert('Arquivo inválido.'); }
  };
  document.getElementById('wipe').onclick = () => {
    if (!confirm(fb.user ? 'Apagar todos os gastos, entradas e objetivos, aqui e na nuvem? Não dá para desfazer.' : 'Apagar todos os gastos e objetivos? Não dá para desfazer.')) return;
    const gone = [...S.items, ...S.incomes, ...S.goals].map(o => o.id); S = emptyState(); gone.forEach(kill); save(); closeSheet(); render();
  };
}

/* ---------- login com Google + nuvem (Firebase, mesmo projeto do KOVA) ---------- */
// Esses valores não são senha: quem protege os dados são as regras do Firestore
// (users/<uid>/... só a própria pessoa lê e escreve).
const FB_CFG = {
  apiKey: "AIzaSyBXpl9IlTrBzpkb83DtGYo1QNseuKeW5MQ",
  authDomain: "victreina.firebaseapp.com",
  projectId: "victreina",
  storageBucket: "victreina.firebasestorage.app",
  messagingSenderId: "821889110598",
  appId: "1:821889110598:web:4778264fc0e5ee303e7047"
};
const fb = { ready:false, user:null, col:null, last:{}, unsub:null, timer:null, pending:null, status:'local' };
const OWNER = 'grana-owner';
const getOwner = () => { try { return localStorage.getItem(OWNER) || ''; } catch(e){ return ''; } };
const setOwner = v => { try { localStorage.setItem(OWNER, v); } catch(e){} };
const emptyState = () => ({ v:2, items:[], learned:{}, income:0, goals:[], incomes:[], del:[] });

// texto estável (chaves em ordem) para comparar o que já foi enviado
function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
// um documento por mês (gastos + entradas daquele mês) e um "meta" com o resto
function docsFromState(st){
  const d = { meta: { v:2, learned:st.learned || {}, income:st.income || 0, goals:st.goals || [], del:st.del || [] } };
  const box = k => d[k] = d[k] || { items:[], incomes:[] };
  for (const i of st.items) box('m-' + ym(i.date)).items.push(i);
  for (const x of st.incomes) box('m-' + ym(x.date)).incomes.push(x);
  return JSON.parse(JSON.stringify(d));
}
function stateFromDocs(docs){
  const st = emptyState();
  for (const [id, d] of Object.entries(docs)) {
    if (id === 'meta') Object.assign(st, { learned:d.learned || {}, income:d.income || 0, goals:d.goals || [], del:d.del || [] });
    else { st.items.push(...(d.items || [])); st.incomes.push(...(d.incomes || [])); }
  }
  return st;
}
// junta dois estados; em caso de conflito no mesmo item, vale o "b"
function mergeStates(a, b){
  const del = new Set([...(a.del || []), ...(b.del || [])]);
  const un = (x = [], y = []) => { const m = new Map(); for (const o of x) m.set(o.id, o); for (const o of y) m.set(o.id, o); return [...m.values()].filter(o => !del.has(o.id)); };
  return { v:2, items:un(a.items, b.items), incomes:un(a.incomes, b.incomes), goals:un(a.goals, b.goals),
    learned:{ ...(a.learned || {}), ...(b.learned || {}) }, income:b.income || a.income || 0, del:[...del].slice(-500) };
}
function kill(id){ S.del = [...(S.del || []).filter(x => x !== id), id].slice(-500); }
function revive(id){ S.del = (S.del || []).filter(x => x !== id); }

function setSync(s){ fb.status = s; const el = document.getElementById('acct'); if (el) el.dataset.s = s; }
function schedulePush(){ if (!fb.user) return; clearTimeout(fb.timer); setSync('saving'); fb.timer = setTimeout(push, 500); }
async function push(){
  if (!fb.user) return;
  const docs = docsFromState(S), batch = fb.fs.batch(); let n = 0;
  for (const [id, d] of Object.entries(docs)) { const j = stable(d); if (fb.last[id] !== j) { batch.set(fb.col.doc(id), d); fb.last[id] = j; n++; } }
  for (const id of Object.keys(fb.last)) if (!docs[id]) { batch.delete(fb.col.doc(id)); delete fb.last[id]; n++; }
  if (!n) { setSync('ok'); return; }
  try { await batch.commit(); setSync('ok'); } catch(e) { setSync('err'); }
}
function applyRemote(st){
  if (stable(st) === stable(S)) return;
  if ($scrim.classList.contains('open')) { fb.pending = st; return; }
  const a = document.activeElement, focusId = a && a.id, pos = a && a.selectionStart;
  S = st; saveLocal(); render();
  const el = focusId && document.getElementById(focusId);
  if (el && el.focus) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(e){} }
}

const loadScript = src => new Promise((ok, err) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = err; document.head.appendChild(s); });
async function connectFirebase(){
  if (!location.protocol.startsWith('http')) return;
  try { for (const m of ['app','auth','firestore']) await loadScript(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${m}-compat.js`); }
  catch(e) { return; }
  firebase.initializeApp(FB_CFG);
  fb.fs = firebase.firestore();
  try { await fb.fs.enablePersistence({ synchronizeTabs:true }); } catch(e){}
  fb.auth = firebase.auth(); fb.ready = true;
  fb.auth.getRedirectResult().catch(e => toast('Não deu para entrar com Google (' + e.code + ')'));
  fb.auth.onAuthStateChanged(async u => {
    if (u) {
      fb.user = u; setSync('saving');
      fb.col = fb.fs.collection('users').doc(u.uid).collection('gastos');
      let snap = null;
      try { snap = await fb.col.get(); } catch(e) { try { snap = await fb.col.get({ source:'cache' }); } catch(e2){} }
      const docs = {}; if (snap) snap.forEach(d => docs[d.id] = d.data());
      fb.last = Object.fromEntries(Object.entries(docs).map(([k,v]) => [k, stable(v)]));
      // dados que estavam só neste aparelho entram na conta (a não ser que sejam de outra conta)
      const owner = getOwner();
      const local = owner && owner !== u.uid ? emptyState() : S;
      S = mergeStates(local, stateFromDocs(docs));
      setOwner(u.uid); saveLocal(); push();
      if (fb.unsub) fb.unsub();
      fb.unsub = fb.col.onSnapshot(sn => {
        if (sn.metadata.hasPendingWrites) return;
        const d2 = {}; sn.forEach(d => d2[d.id] = d.data());
        fb.last = Object.fromEntries(Object.entries(d2).map(([k,v]) => [k, stable(v)]));
        applyRemote(stateFromDocs(d2));
      }, () => setSync('err'));
    } else {
      if (fb.unsub) fb.unsub(); fb.unsub = null;
      fb.user = null; fb.col = null; fb.last = {}; setSync('local');
    }
    render(); paintAccount();
  });
  render(); paintAccount();
}
function signIn(){
  if (!fb.ready) { toast('Sem conexão com o Google agora. Tente de novo com internet.'); return; }
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt:'select_account' });
  fb.auth.signInWithPopup(p).catch(e => {
    if (['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) fb.auth.signInWithRedirect(p);
    else if (e.code !== 'auth/popup-closed-by-user') toast('Não deu para entrar com Google (' + e.code + ')');
  });
}
async function signOut(){
  if (!confirm('Sair da conta? Seus dados continuam salvos na nuvem e voltam quando você entrar de novo.')) return;
  clearTimeout(fb.timer); await push();
  await fb.auth.signOut();
  S = emptyState(); setOwner(''); saveLocal(); closeSheet(); render();
}
const GOOGLE_G = '<svg viewBox="0 0 48 48" width="20" height="20"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
function loginCard(){
  if (fb.user || !fb.ready) return '';
  return `<div class="card logincard">
    <div><b>Nunca perca seus dados</b><small>Entre com Google para salvar tudo na nuvem e usar em qualquer aparelho.</small></div>
    <button class="gbtn" data-signin>${GOOGLE_G}Entrar com Google</button>
  </div>`;
}
function paintAccount(){
  const el = document.getElementById('acct'); if (!el) return;
  if (fb.user) {
    el.hidden = false; el.dataset.s = fb.status;
    el.innerHTML = fb.user.photoURL ? `<img src="${esc(fb.user.photoURL)}" alt="" referrerpolicy="no-referrer">` : `<span>${esc((fb.user.displayName || fb.user.email || '?')[0].toUpperCase())}</span>`;
  } else el.hidden = true;
}
function accountBlock(){
  if (fb.user) {
    const msg = { ok:'Tudo salvo na nuvem', saving:'Salvando...', err:'Sem internet: salvo no aparelho, sobe quando voltar', local:'' }[fb.status] || '';
    return `<div class="acctrow">
      ${fb.user.photoURL ? `<img src="${esc(fb.user.photoURL)}" alt="" referrerpolicy="no-referrer">` : ''}
      <div class="t"><b>${esc(fb.user.displayName || 'Sua conta')}</b><small>${esc(fb.user.email || '')}</small><small class="st" data-s="${fb.status}">${msg}</small></div>
      <button class="mbtn ghost" id="signout">Sair</button></div>`;
  }
  return `<div class="acctrow"><div class="t"><b>Seus dados estão só neste aparelho</b><small>Entre para salvar na nuvem e não perder nada.</small></div></div>
    <button class="gbtn wide" data-signin>${GOOGLE_G}Entrar com Google</button>`;
}

/* ---------- toast ---------- */
const $toast = document.getElementById('toast'); let tTimer, tUndo;
function toast(msg, undo){
  $toast.querySelector('span').textContent = msg;
  tUndo = undo; $toast.querySelector('button').style.display = undo ? '' : 'none';
  $toast.classList.add('show'); clearTimeout(tTimer);
  tTimer = setTimeout(() => $toast.classList.remove('show'), 4000);
}
$toast.querySelector('button').onclick = () => { if (tUndo) tUndo(); tUndo = null; $toast.classList.remove('show'); };

/* ---------- cliques gerais ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-go],[data-edit],[data-mon],[data-catview],[data-clearcat],[data-view],[data-income],[data-paid],[data-newgoal],[data-editgoal],[data-deposit],[data-setmonth],[data-editin],[data-signin],#acct');
  if (!t) return;
  const d = t.dataset;
  if (d.tab || d.go) { ui.tab = d.tab || d.go; if (ui.tab !== 'historico') ui.cat = null; if (ui.month > ym(today()) && ui.tab !== 'panorama' && ui.tab !== 'objetivos') ui.month = ym(today()); render(); scrollTo(0,0); }
  else if (d.edit) openEdit(d.edit);
  else if (d.mon) { ui.month = addMonths(ui.month, Number(d.mon)); render(); }
  else if (d.setmonth) { ui.month = d.setmonth; render(); }
  else if (d.catview) { ui.cat = d.catview; ui.q = ''; ui.tab = 'historico'; if (ui.month > ym(today())) ui.month = ym(today()); render(); scrollTo(0,0); }
  else if ('clearcat' in d) { ui.cat = null; render(); }
  else if (d.view) { ui.view = d.view; render(); }
  else if ('income' in d) openIncome();
  else if (d.paid) { const i = S.items.find(x => x.id === d.paid); if (i) { i.split.paid = true; save(); render(); toast('Marcado como recebido', () => { i.split.paid = false; save(); render(); }); } }
  else if ('newgoal' in d) openGoal();
  else if (d.editgoal) openGoal(d.editgoal);
  else if (d.deposit) openDeposit(d.deposit);
  else if (d.editin) openEntry(d.editin);
  else if ('signin' in d) signIn();
  else if (t.id === 'acct') openSettings();
});
document.getElementById('gear').onclick = openSettings;

connectFirebase();
applyTheme(getTheme());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme(getTheme()));
render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadSW && !window.__reloaded) { window.__reloaded = true; save(); location.reload(); }
  });
}
